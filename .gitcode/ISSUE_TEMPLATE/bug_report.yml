name: 缺陷报告
description: 报告 AtomGit CLI 中可以稳定复现的问题。
title: "[缺陷] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你报告问题。提交日志前，请删除令牌、Cookie、私有仓库信息和其他敏感内容。

  - type: input
    id: version
    attributes:
      label: AtomGit CLI 版本
      description: 请运行 `ag version`，并注明 CLI 的安装方式。
      placeholder: "v0.1.0；通过包管理器安装"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 操作系统与架构
      description: 请填写操作系统版本和 CPU 架构；如果从源码运行，也请填写 Go 版本。
      placeholder: "Windows 11 x64；Go 1.24.2（源码运行）"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 从一次干净的命令调用开始，写明相关命令、参数和仓库环境。
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望该命令执行什么操作？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？如适用，请附上退出码。
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 脱敏后的输出或日志
      description: 请删除 Authorization/Cookie 请求头、令牌、OAuth 授权码、Webhook 密钥、私有 URL 和未脱敏的响应正文。
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认这不是重复问题。
          required: true
        - label: 我已从报告中删除凭据和私有数据。
          required: true
