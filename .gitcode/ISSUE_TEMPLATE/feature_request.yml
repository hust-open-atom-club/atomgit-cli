name: 功能或 API 建议
description: 提议面向用户的改进，或补充缺失的 AtomGit API 能力。
title: "[功能] "
body:
  - type: markdown
    attributes:
      value: |
        请先说明要解决的用户问题。包含凭据、私有仓库信息或可被利用细节的内容，不应公开发布。

  - type: textarea
    id: use_case
    attributes:
      label: 使用场景
      description: 谁需要这个能力？它要改进什么工作流程？
    validations:
      required: true

  - type: input
    id: area
    attributes:
      label: 命令或 API 范围
      description: 如果已知，请填写相关命令、资源或 AtomGit API 接口。
      placeholder: "PR 检查、流水线任务或仓库 API"
    validations:
      required: true

  - type: input
    id: reference
    attributes:
      label: 文档或接口参考
      description: 请提供相关文档、API 版本或接口路径；如果尚未有明确参考，请说明原因。
      placeholder: "docs/usage.md#pull-requests；API v5 /projects/:id/merge_requests"
    validations:
      required: true

  - type: input
    id: module
    attributes:
      label: 所属模块或维护范围
      description: 请填写可能涉及的命令、模块或代码目录，便于维护者分派和评估。
      placeholder: "pkg/cmd/pr 或 internal/api"
    validations:
      required: true

  - type: textarea
    id: desired_behavior
    attributes:
      label: 期望行为
      description: 请给出你期望的命令、输出或 API 行为示例。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与非目标
      description: 请说明当前的替代做法，以及这个建议明确不应改变的内容。

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 列出可以观察和验证的完成条件。
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认这不是重复建议。
          required: true
        - label: 我没有包含凭据或私有仓库信息。
          required: true
