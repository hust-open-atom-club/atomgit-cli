name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  repository: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: [ubuntu-latest, x64, small]
    env:
      GOPROXY: https://goproxy.cn,direct
    steps:
      - name: Check out PR code
        if: ${{ atomgit.head_ref != '' }}
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check out pushed code
        if: ${{ atomgit.head_ref == '' }}
        uses: checkout

      - name: Set up Go
        uses: setup-go
        with:
          version: "1.24.13"
          cache: true

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files need formatting:"
            echo "$files"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build ./cmd/ag
