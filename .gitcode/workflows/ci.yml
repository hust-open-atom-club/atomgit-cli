name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  repository: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: [ubuntu-latest, x64, small]
    steps:
      - name: Check out code
        uses: checkout

      - name: Set up Go
        uses: setup-go
        with:
          go-version: "1.24.2"
          cache: true

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files need formatting:"
            echo "$files"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build ./cmd/ag
