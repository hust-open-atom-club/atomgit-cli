version: 2

project_name: ag
dist: dist/.goreleaser

builds:
  - id: ag
    main: ./cmd/ag
    binary: ag
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - loong64
    ignore:
      - goos: darwin
        goarch: loong64
      - goos: windows
        goarch: loong64
    flags:
      - -trimpath
    mod_timestamp: "{{ .Env.AG_BUILD_TIMESTAMP }}"
    ldflags:
      - -s -w
      - -X atomgit.com/hust-open-atom-club/atomgit-cli/internal/version.Version={{ .Env.AG_VERSION }}
      - -X atomgit.com/hust-open-atom-club/atomgit-cli/internal/version.Commit={{ .FullCommit }}
      - -X atomgit.com/hust-open-atom-club/atomgit-cli/internal/version.BuildDate={{ .Env.AG_BUILD_DATE }}
      - -X atomgit.com/hust-open-atom-club/atomgit-cli/internal/version.Source=release

  - id: ag-npm
    main: ./cmd/ag
    binary: ag
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - loong64
    ignore:
      - goos: darwin
        goarch: loong64
      - goos: windows
        goarch: loong64
    flags:
      - -trimpath
    mod_timestamp: "{{ .Env.AG_BUILD_TIMESTAMP }}"
    ldflags:
      - -s -w
      - -X atomgit.com/hust-open-atom-club/atomgit-cli/internal/version.Version={{ .Env.AG_VERSION }}
      - -X atomgit.com/hust-open-atom-club/atomgit-cli/internal/version.Commit={{ .FullCommit }}
      - -X atomgit.com/hust-open-atom-club/atomgit-cli/internal/version.BuildDate={{ .Env.AG_BUILD_DATE }}
      - -X atomgit.com/hust-open-atom-club/atomgit-cli/internal/version.Source=npm

  - id: ag-homebrew
    main: ./cmd/ag
    binary: ag
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .Env.AG_BUILD_TIMESTAMP }}"
    ldflags:
      - -s -w
      - -X atomgit.com/hust-open-atom-club/atomgit-cli/internal/version.Version={{ .Env.AG_VERSION }}
      - -X atomgit.com/hust-open-atom-club/atomgit-cli/internal/version.Commit={{ .FullCommit }}
      - -X atomgit.com/hust-open-atom-club/atomgit-cli/internal/version.BuildDate={{ .Env.AG_BUILD_DATE }}
      - -X atomgit.com/hust-open-atom-club/atomgit-cli/internal/version.Source=homebrew

  - id: ag-winget
    main: ./cmd/ag
    binary: ag
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .Env.AG_BUILD_TIMESTAMP }}"
    ldflags:
      - -s -w
      - -X atomgit.com/hust-open-atom-club/atomgit-cli/internal/version.Version={{ .Env.AG_VERSION }}
      - -X atomgit.com/hust-open-atom-club/atomgit-cli/internal/version.Commit={{ .FullCommit }}
      - -X atomgit.com/hust-open-atom-club/atomgit-cli/internal/version.BuildDate={{ .Env.AG_BUILD_DATE }}
      - -X atomgit.com/hust-open-atom-club/atomgit-cli/internal/version.Source=winget

  - id: ag-scoop
    main: ./cmd/ag
    binary: ag
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .Env.AG_BUILD_TIMESTAMP }}"
    ldflags:
      - -s -w
      - -X atomgit.com/hust-open-atom-club/atomgit-cli/internal/version.Version={{ .Env.AG_VERSION }}
      - -X atomgit.com/hust-open-atom-club/atomgit-cli/internal/version.Commit={{ .FullCommit }}
      - -X atomgit.com/hust-open-atom-club/atomgit-cli/internal/version.BuildDate={{ .Env.AG_BUILD_DATE }}
      - -X atomgit.com/hust-open-atom-club/atomgit-cli/internal/version.Source=scoop

archives:
  - id: ag
    ids:
      - ag
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "ag_{{ .Os }}_{{ .Arch }}"
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .Env.AG_BUILD_DATE }}"
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .Env.AG_BUILD_DATE }}"

  - id: ag-npm
    ids:
      - ag-npm
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "ag_{{ .Os }}_{{ .Arch }}_npm"
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .Env.AG_BUILD_DATE }}"
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .Env.AG_BUILD_DATE }}"

  - id: ag-homebrew
    ids:
      - ag-homebrew
    formats:
      - tar.gz
    name_template: "ag_{{ .Os }}_{{ .Arch }}_homebrew"
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .Env.AG_BUILD_DATE }}"
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .Env.AG_BUILD_DATE }}"

  - id: ag-winget
    ids:
      - ag-winget
    formats:
      - zip
    name_template: "ag_{{ .Os }}_{{ .Arch }}_winget"
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .Env.AG_BUILD_DATE }}"
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .Env.AG_BUILD_DATE }}"

  - id: ag-scoop
    ids:
      - ag-scoop
    formats:
      - zip
    name_template: "ag_{{ .Os }}_{{ .Arch }}_scoop"
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .Env.AG_BUILD_DATE }}"
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .Env.AG_BUILD_DATE }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ .Env.AG_SNAPSHOT_VERSION }}"

changelog:
  disable: true

release:
  disable: true
