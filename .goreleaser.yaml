version: 2

project_name: ag-cli
dist: dist/.goreleaser

builds:
  - id: ag-cli
    main: ./cmd/ag-cli
    binary: ag-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - loong64
    ignore:
      - goos: darwin
        goarch: loong64
      - goos: windows
        goarch: loong64
    flags:
      - -trimpath
    mod_timestamp: "{{ .Env.AG_BUILD_TIMESTAMP }}"
    ldflags:
      - -s -w
      - -X atomgit.com/hust-open-atom-club/atomgit-cli/internal/version.Version={{ .Env.AG_VERSION }}
      - -X atomgit.com/hust-open-atom-club/atomgit-cli/internal/version.Commit={{ .FullCommit }}
      - -X atomgit.com/hust-open-atom-club/atomgit-cli/internal/version.BuildDate={{ .Env.AG_BUILD_DATE }}

archives:
  - id: ag-cli
    ids:
      - ag-cli
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "ag_{{ .Os }}_{{ .Arch }}"
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .Env.AG_BUILD_DATE }}"
    files:
      # Unmatched glob on Windows deliberately omits Unix manuals.
      - src: '{{ if eq .Os "windows" }}dist/man/windows/*.1{{ else }}dist/man/man1/*.1{{ end }}'
        dst: share/man/man1
        strip_parent: true
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .Env.AG_BUILD_DATE }}"
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .Env.AG_BUILD_DATE }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ .Env.AG_SNAPSHOT_VERSION }}"

changelog:
  disable: true

release:
  disable: true
