version: "2"
linters:
  default: standard
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - gocheckcompilerdirectives
    - gosec
    - nolintlint
    - revive

  exclusions:
    warn-unused: true
    presets:
      - comments
      - std-error-handling
      - common-false-positives

    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
